networks:
  emby:
    name: emby
    driver: bridge

services:

  # Media Server
  emby:
    image: emby/embyserver:4.10.0.11  # https://hub.docker.com/r/emby/embyserver/tags
    container_name: emby
    hostname: emby
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: "4096M"
          pids: 512
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      UID: "${PUID_NON_ROOT:?User ID missing}"
      GID: "${PGID_NON_ROOT:?Group ID missing}"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8096/emby/system/info/public?format=json" ]
      timeout: 5s
    labels:
      # Reverse proxy config
      traefik.enable: "true"
      traefik.http.routers.emby.rule: "Host(`emby.${DOMAIN_NAME}`)"
      traefik.http.routers.emby.entrypoints: "websecure"
      traefik.http.routers.emby.tls: "true"
      traefik.http.routers.emby.middlewares: "no-forward-auth@file"
      traefik.http.services.emby.loadbalancer.server.port: "8096"
      # Monitor config
      kuma.emby.http.name: "Emby (Media Server)"
      kuma.emby.http.url: "${EMBY_MONITOR_URL:?[emby] Monitor URL missing}"
      kuma.emby.http.max_retries: "3"
      kuma.emby.http.notification_name_list: '["emby_status"]'
      kuma.emby.http.tag_names: '[{"name": "alertable"}]'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - emby
    ports:
      - "8096:8096"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # tmpfs: '/tmp' used by container for transcoding, I think
    # user: "${PUID_NON_ROOT:?User ID missing}:${PGID_NON_ROOT:?Group ID missing}"  # Doesn't work, must use environment variables
    volumes:
      # Volume mounts from host system
      - "${AUDIO_DIRECTORY}:/media/audio"
      - "${BOOKS_DIRECTORY}:/media/books"
      - "${MOVIE_DIRECTORY}:/media/movies"
      - "${RECORDINGS_DIRECTORY}:/media/recordings"
      - "${SPORTS_DIRECTORY}:/media/sports"
      - "${TV1_DIRECTORY}:/media/tv1"
      - "${TV2_DIRECTORY}:/media/tv2"
      - "${TV_TRASH_DIRECTORY}:/media/trash"
      - "${TV_KIDS_DIRECTORY}:/media/kids"
      # Persistent volumes
      - ../storage/emby/config/:/config/
      - ../storage/emby/backup/:/backup/

  # Custom channel maker
  tunarr:
    image: chrisbenincasa/tunarr:1.2.10  # https://github.com/chrisbenincasa/tunarr/releases
    container_name: tunarr
    hostname: tunarr
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    depends_on:
      emby:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2048M"
          pids: 512
    devices:
      - /dev/dri:/dev/dri
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      LOG_LEVEL: "INFO"
      # Hardware Acceleration
      LIBVA_DRIVER_NAME: "radeonsi"
      LIBVA_DRIVERS_PATH: "/usr/lib/x86_64-linux-gnu/dri"
    group_add:
      - "44"   # `getent group video`
      - "105"  # `getent group render`
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/system/health | jq -e '.BaseImageHealthCheck.type == \"healthy\"' > /dev/null" ]
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - emby
    ports:
      - "4019:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    user: "${PUID_ROOT:?User ID missing}:${PGID_ROOT:?Group ID missing}"  # root needed for MeiliSearch DB
    volumes:
      # Volume mounts from host system
      - "${TV1_DIRECTORY}:/media/tv1:ro"
      - "${TV2_DIRECTORY}:/media/tv2:ro"
      - "${TV_TRASH_DIRECTORY}:/media/trash:ro"
      - "${TV_KIDS_DIRECTORY}:/media/kids:ro"
      # Persistent volumes
      - ../storage/tunarr/config/:/config/tunarr/
