networks:
  qbittorrent:
    name: qbittorrent
    driver: bridge

services:

  # Torrent Downloader
  qbittorrent:
    image: linuxserver/qbittorrent:5.1.4-libtorrentv1  # https://hub.docker.com/r/linuxserver/qbittorrent/tags
    container_name: qbittorrent
    hostname: qbittorrent
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "4096M"
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      PUID: "${PUID_NON_ROOT:?User ID missing}"
      PGID: "${PGID_NON_ROOT:?Group ID missing}"
      # UI config
      WEBUI_PORT: "9000"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/api/v2/app/version" ]
      timeout: 5s
    labels:
      # Reverse proxy config
      traefik.enable: "true"
      traefik.http.routers.qbittorrent.rule: "Host(`qbittorrent.${DOMAIN_NAME}`)"
      traefik.http.routers.qbittorrent.entrypoints: "websecure"
      traefik.http.routers.qbittorrent.tls: "true"
      traefik.http.routers.qbittorrent.middlewares: "no-forward-auth@file"
      traefik.http.services.qbittorrent.loadbalancer.server.port: "9000"
      # Monitor config
      kuma.qbittorrent.http.name: "qBittorrent (Torrent Downloader)"
      kuma.qbittorrent.http.url: "${QBITTORRENT_MONITOR_URL:?[qbittorrent] Monitor URL missing}"
    networks:
      - qbittorrent
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # user: "${PUID_NON_ROOT:?User ID missing}:${PGID_NON_ROOT:?Group ID missing}"  # Doesn't work, must use environment variables
    volumes:
      # Volume mounts from host system
      - "${DOWNLOADS_DIRECTORY}:/downloads"
      # Persistent volumes
      - ../storage/qbittorrent/config/:/config/
