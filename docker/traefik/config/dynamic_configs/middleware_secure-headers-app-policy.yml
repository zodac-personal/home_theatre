# As secure-headers@file, minus the three headers an application can express better than the proxy can:
# Content-Security-Policy, Permissions-Policy and Referrer-Policy.
#
# WHY IT EXISTS. Traefik's customResponseHeaders SETS a header rather than adding to it, so a proxy-wide CSP
# silently replaces whatever the application sent. For an app that ships a considered policy that is a downgrade,
# not a hardening: Diurnal sends default-src/script-src/object-src/base-uri/form-action with pinned inline-script
# hashes, and secure-headers@file was replacing all of it with "frame-ancestors 'self'; upgrade-insecure-requests;"
# - leaving the browser with no script controls at all.
#
# WHAT IS DELIBERATELY KEPT. Everything transport-level, because that IS the proxy's business and the origin
# cannot know it: HSTS (the app sets none, so this is additive rather than a replacement), nosniff, frame
# options, and the robots tag.
#
# SCOPE. Attach this only to routers whose application ships its own CSP. Currently that is the production
# 'diurnal' router alone (compose/diurnal.yml), reached via the no-forward-auth-app-policy@file chain. Every
# other router keeps secure-headers@file untouched, which is why this is a sibling middleware rather than an
# edit to that one. Before adding a router here, confirm the application actually sends a CSP covering
# script-src and object-src - dropping the proxy CSP for an app that sends none is a downgrade, not a fix.
http:
  middlewares:
    secure-headers-app-policy:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
        customResponseHeaders:
          # Deprecated filter, known to be exploitable for XSS in the browsers that still honour it. OWASP
          # recommends disabling it explicitly rather than omitting the header. CSP does this job properly.
          X-XSS-Protection: "0"
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex,"
        forceSTSHeader: true
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: false  # Only enable if registered at https://hstspreload.org/
