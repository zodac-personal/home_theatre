# Host-side logrotate config for Traefik's access log.
#
# Traefik never rotates its access log itself (the `log.maxSize`/`compress` settings only cover its own log),
# so without this `storage/<traefik-dir>/logs/access/access.log` grows forever.
# The file is renamed, then Traefik is sent USR1, which makes it close and reopen its log files, so no lines
# are lost and the new access.log is created by Traefik itself, as its own user.
#
# Install/test commands for each host live above the `user:` line of the Traefik service using it
# (compose/traefik.yml, compose/traefik-oracle.yml). The <PLACEHOLDERS> are filled in there by sed, since
# logrotate needs absolute host paths and those must not be committed. Daily runs come from logrotate.timer.

<REPO_DIR>/storage/<STORAGE_DIR>/logs/access/access.log {
    daily
    rotate 14
    dateext
    compress
    # Yesterday's file stays uncompressed for a day, in case Traefik writes a last buffered line
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        docker kill --signal=USR1 <CONTAINER> >/dev/null 2>&1 || true
    endscript
}
