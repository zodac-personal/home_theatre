networks:
  traefik-oracle:
    name: traefik-oracle
    driver: bridge

services:

  # Reverse proxy
  traefik-oracle:
    image: traefik:v3.7.17  # https://github.com/traefik/traefik/releases
    container_name: traefik-oracle
    hostname: traefik-oracle
    command: --configFile=/config/traefik-oracle.yml
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256M"
          pids: 256
    environment:
      # Variables used for Go template substitution in the dynamic config files
      DOMAIN_NAME: "${DOMAIN_NAME:?[traefik-oracle] Domain name missing}"
      UPTIME_KUMA_PORT: "${UPTIME_KUMA_PORT:?[traefik-oracle] Uptime Kuma port missing}"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - traefik-oracle
      - uptime-kuma
    ports:
      - "443:443"
      - "5555:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # Dedicated ID with no host account: the host's login user has sudo/docker, and 1000 belongs to uptime-kuma
    user: "2000:2000"
    volumes:
      # Volume mounts from host system
      - ../docker/traefik/config/traefik-oracle.yml:/config/traefik-oracle.yml:ro
      - ../docker/traefik/config/dynamic_configs_oracle/:/dynamic_configs:ro
      - ../docker/traefik/certs/cloudflare_origin_cert.pem:/etc/certs/cloudflare_origin_cert.pem:ro
      - ../docker/traefik/certs/cloudflare_origin_key.pem:/etc/certs/cloudflare_origin_key.pem:ro
      # Persistent volumes
      - ../storage/traefik-oracle/logs/access/:/var/log/traefik/access/
