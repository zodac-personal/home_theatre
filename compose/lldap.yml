networks:
  lldap:
    name: lldap
    driver: bridge
services:

  # LDAP User-store
  lldap:
    # TODO: Try lldap/lldap:2026-07-19-alpine-rootless
    image: lldap/lldap:2026-07-19-alpine  # https://hub.docker.com/r/lldap/lldap/tags?name=-alpine | https://github.com/lldap/lldap/releases
    container_name: lldap
    hostname: lldap
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    depends_on:
      lldap-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
          pids: 128
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      UID: "${PUID_ROOT:?User ID missing}"
      GID: "${PGID_ROOT:?Group ID missing}"
      # LDAP config
      LLDAP_DATABASE_URL: "postgres://${LLDAP_DB_USER:?[lldap] Missing DB user}:${LLDAP_DB_PASSWORD:?[lldap] Missing DB password}@lldap-db:${LLDAP_DB_PORT:?[lldap] Missing DB port}/${LLDAP_DB_NAME:?[lldap] Missing DB name}"
      LLDAP_LDAP_BASE_DN: "${LLDAP_BASE_DN:?[lldap] Missing base LDAP DN}"
      LLDAP_LDAP_USER_PASS: "${LLDAP_ADMIN_PASSWORD:?[lldap] Missing LDAP admin password}"
      # Secrets
      LLDAP_JWT_SECRET: "${LLDAP_JWT_SECRET:?[lldap] Missing LDAP JWT secret}"
      LLDAP_KEY_FILE: ""  # Empty on purpose so KEY_SEED is used
      LLDAP_KEY_SEED: "${LLDAP_KEY_SEED:?[lldap] Missing LDAP key seed}"
    labels:
      # Reverse proxy config for Authelia UI and OIDC
      traefik.enable: "true"
      traefik.docker.network: "lldap"
      traefik.http.routers.lldap.rule: "Host(`lldap.${DOMAIN_NAME}`)"
      traefik.http.routers.lldap.entrypoints: "websecure"
      traefik.http.routers.lldap.tls: "true"
      traefik.http.routers.lldap.service: "lldap"
      traefik.http.services.lldap.loadbalancer.server.port: "17170"
      # Monitor config
      kuma.lldap.http.name: "LLDAP (LDAP Server)"
      kuma.lldap.http.url: "${LLDAP_MONITOR_URL:?[lldap] Monitor URL missing}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lldap
    ports:
      - "3890:3890"
      - "17170:17170"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # user: "${PUID_ROOT:?User ID missing}:${PGID_ROOT:?Group ID missing}"  # Doesn't work, must use environment variables
    volumes:
      # Persistent volumes
      - ../storage/lldap/data/:/data/

  lldap-db:
    image: postgres:18.4-alpine  # https://hub.docker.com/_/postgres
    container_name: lldap-db
    hostname: lldap-db
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
          pids: 256
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      PGTZ: "${TIMEZONE:?Timezone missing}"
      POSTGRES_INITDB_ARGS: "--set=log_timezone=${TIMEZONE:?Timezone missing}"
      # Database config
      PGPORT: "${LLDAP_DB_PORT:?[lldap-db] Missing DB port}"
      POSTGRES_DB: "${LLDAP_DB_NAME:?[lldap-db] Missing DB name}"
      POSTGRES_PASSWORD: "${LLDAP_DB_PASSWORD:?[lldap-db] Missing DB password}"
      POSTGRES_USER: "${LLDAP_DB_USER:?[lldap-db] Missing DB user}"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "${LLDAP_DB_PORT:?[lldap-db] Missing DB port}"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "pg_isready", "--host", "localhost", "-U", "${LLDAP_DB_USER:?[lldap-db] Database user missing}", "-d", "${LLDAP_DB_NAME:?[lldap-db] Database name missing}", "-p", "${LLDAP_DB_PORT:?[lldap-db] Database port missing}" ]
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lldap
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:uid=999,gid=999,mode=775  # Giving access to startup root execution
    user: "999:999"  # postgres user
    volumes:
      # Persistent volumes
      - ../storage/lldap-db/:/var/lib/postgresql/
