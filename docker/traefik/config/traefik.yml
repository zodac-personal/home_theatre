# Traefik 3.x (YAML)
# Taken from https://github.com/brokenscripts/authentik_traefik/blob/traefik3/appdata/traefik/config/traefik.yaml

################################################################
# Global configuration - https://doc.traefik.io/traefik/reference/static-configuration/file/
################################################################

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Default timeouts for connections to a backend service. These map straight onto Go's http.Transport, so
# read them with those semantics:
#
#   dialTimeout           - TCP connect only; it has no bearing on how long a request may then take. Kept
#                           short because it is the floor on failing over to the status page: a host that
#                           is powered off drops packets rather than refusing, so Traefik waits out this
#                           timeout before the 502 that redirect-on-gateway-error@file turns into a 307.
#                           Every backend is on the LAN, where a TCP connect is single-digit milliseconds,
#                           so 10s is already generous.
#   responseHeaderTimeout - how long to wait for the backend's response HEADERS after the request has been
#                           fully written. It does NOT limit the response body, so streaming responses,
#                           large downloads and websockets are unaffected once the first byte arrives - but
#                           a slow-to-first-byte endpoint hits it and the client gets a 504. SonarQube's
#                           analysis report submission and Emby's transcode startup are both capable of
#                           exceeding 30s, which is why this is no longer set that low. Traefik's own
#                           default is 0 (wait forever); 90s is a deliberate middle ground, chosen to sit
#                           just under Cloudflare's 100s origin timeout so a genuinely hung backend still
#                           surfaces as our 504 rather than Cloudflare's 524.
#   idleConnTimeout       - how long an IDLE pooled keep-alive connection is held before being closed. It
#                           does not apply to active connections of any kind, websockets included, so it is
#                           purely a connection-churn tradeoff. Left at 1m, below Go's 90s default.
serversTransport:
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 90s
    idleConnTimeout: 1m

################################################################
# Logs - https://doc.traefik.io/traefik/observability/logs/
################################################################

# No filePath, so Traefik logs to stdout and the container's json-file driver (see compose/traefik.yml)
# owns rotation. maxSize/maxAge/maxBackups/compress are lumberjack settings that only take effect when
# filePath is set, so they are omitted here rather than left in place doing nothing.
log:
  level: INFO # Options: DEBUG, INFO, WARN, ERROR (Default), PANIC, FATAL
  noColor: false # Set to 'true' if format is 'json'

accessLog:
  filePath: "/var/log/traefik/access/access.log"
  format: json
  bufferingSize: 100  # Trades a small number of lost lines on an unclean shutdown for far fewer syscalls

################################################################
# API and Dashboard
################################################################

api:
  dashboard: true
  insecure: false  # Dashboard/API is exposed via the 'api@internal' router, behind auth
ping: { }

################################################################
# Entrypoints - https://doc.traefik.io/traefik/routing/entrypoints/
################################################################

entryPoints:
  # No longer published to the host, so it is reachable only from the Docker network:
  # used by `traefik healthcheck --ping` and the '/ping' router. Replaces the implicit
  # entrypoint that 'api.insecure' previously created.
  traefik:
    address: ":8080"
    http:
      aliasHeadersStrategy: delete  # see websecure below

  # No 'web' entrypoint is defined. compose/traefik.yml publishes 443 only, so nothing off-host can reach
  # port 80 and a redirections block here would never fire: plaintext requests are redirected at the
  # Cloudflare edge instead ("Always Use HTTPS", which is what emits the 301 + cache-control: max-age=14400
  # seen on those redirects). If port 80 is ever published, re-add the entrypoint with its redirection.

  websecure:
    address: ":443"
    http:
      # A header whose name ALIASES another - Remote_User, or Remote.User, for Remote-User - is a distinct
      # header to Traefik and to any Go backend, but CGI/WSGI/PHP backends derive variable names by mapping
      # both '-' and '_' to '_', so they read it as the header it aliases. That makes strip-auth-headers@file
      # bypassable on those backends: it removes Remote-User, the client resends it as Remote_User, and
      # Django reads both as HTTP_REMOTE_USER. Tandoor (Django) and NetAlertX (PHP) are both such backends.
      # 'delete' drops the aliasing header; 'reject' would 400 the request instead.
      aliasHeadersStrategy: delete
      tls:
        options: default
    forwardedHeaders:
      trustedIPs:
        # Cloudflare (https://www.cloudflare.com/ips-v4)
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
        # Local IPs
        - "127.0.0.1/32"
        - "::1/128"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
        - "fc00::/7"
        - "fe80::/10"

################################################################
# Providers - https://doc.traefik.io/traefik/providers/docker/
################################################################

providers:
  # Enable autoloading of newly created rules by watching a directory
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true

  file:
    directory: /dynamic_configs
    watch: true

  redis:
    endpoints:
      - traefik-provider:6379
    # Placeholder, NOT a secret. compose/traefik.yml renders this file into tmpfs at boot, substituting the
    # real value from TRAEFIK_PROVIDER_PASSWORD (.env, gitignored). Traefik ignores environment variables
    # when --configFile is used, so this indirection is the only way to keep the secret out of the repo.
    password: "__REDIS_PASSWORD__"

################################################################
# Plugins - https://plugins.traefik.io/plugins
################################################################

experimental:
  plugins:
    # Used to redirect when services are down
    traefik-plugin-redirect-on-status:
      moduleName: "github.com/m-riedel/traefik-plugin-redirect-on-status"
      version: "v1.0.1"
