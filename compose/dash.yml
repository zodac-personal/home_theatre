networks:
  dash:
    name: dash
    driver: bridge

services:

  # Server performance monitor
  dash:
    image: mauricenino/dashdot:6.3.4  # https://github.com/MauriceNino/dashdot/releases
    container_name: dash
    hostname: dash
    cap_add:
      - DAC_READ_SEARCH
      - SYS_PTRACE
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    environment:
      # General
      DASHDOT_ALWAYS_SHOW_PERCENTAGES: "true"
      DASHDOT_PAGE_TITLE: "${DOMAIN_NAME:-dash.} [Main]"
      DASHDOT_ROUTING_PATH: "/main"
      DASHDOT_SHOW_DASH_VERSION: "bottom_right"
      DASHDOT_WIDGET_LIST: 'os,cpu,ram,storage,network'
      # CPU
      DASHDOT_ENABLE_CPU_TEMPS: "true"
      DASHDOT_CPU_WIDGET_MIN_WIDTH: "650"
      # OS
      DASHDOT_SHOW_HOST: "true"
      DASHDOT_OS_WIDGET_MIN_WIDTH: "650"
      # Network
      DASHDOT_ACCEPT_OOKLA_EULA: "true"
      # Storage
      DASHDOT_STORAGE_WIDGET_ITEMS_PER_PAGE: "6"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/main/info" ]
      timeout: 5s
    labels:
      # Reverse proxy config
      traefik.enable: "true"
      traefik.http.routers.dash.rule: "Host(`dash.${DOMAIN_NAME}`)"
      traefik.http.routers.dash.entrypoints: "websecure"
      traefik.http.routers.dash.tls: "true"
      traefik.http.routers.dash.middlewares: "authelia-forward-auth@file,dash-root-to-main@redis"
      # Redirect from '/' path to '/dashboard'
      traefik.http.middlewares.dash-root-to-main.redirectregex.regex: "^https?://dash.${DOMAIN_NAME}/?$"
      traefik.http.middlewares.dash-root-to-main.redirectregex.replacement: "https://dash.${DOMAIN_NAME}/main"
      traefik.http.middlewares.dash-root-to-main.redirectregex.permanent: "true"
      # Monitor config
      kuma.dash.http.name: "Dash [Main] (Server Monitor)"
      kuma.dash.http.url: "${DASH_MONITOR_URL:?[dash] Monitor URL missing}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dash
    ports:
      - '4012:3001'
    privileged: true  # Needed to read RAM details
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    user: "${PUID_ROOT:?User ID missing}:${PGID_ROOT:?Group ID missing}"
    volumes:
      # Volume mounts from host system
      - "/:/mnt/host:ro"
