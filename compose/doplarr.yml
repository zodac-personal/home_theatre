services:

  # Discord bot for requests
  doplarr:
    image: ghcr.io/activexray/doplarr_rs:v4.6.0  # https://github.com/activexray/doplarr_rs/releases
    container_name: doplarr
    hostname: doplarr
    cap_add:
      - CHOWN
    cap_drop:
      - ALL
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
          pids: 512
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: ["CMD", "doplarr", "--help"]  # Dummy healthcheck since it can't check the status of the process
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - servarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    user: "${PUID_NON_ROOT:?User ID missing}:${PGID_NON_ROOT:?Group ID missing}"
    volumes:
      # Persistent volumes
      - ../storage/doplarr/config.toml:/config.toml:ro
