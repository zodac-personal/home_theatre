networks:
  uptime-kuma:
    name: uptime-kuma
    driver: bridge

services:

  # Monitoring and alerting
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-rootless  # https://github.com/louislam/uptime-kuma/releases
    container_name: uptime-kuma
    hostname: uptime-kuma
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
          pids: 256
    environment:
      # Base config
      TZ: "${TIMEZONE:?Timezone missing}"
      # Port config
      UPTIME_KUMA_PORT: "${UPTIME_KUMA_PORT:?[uptime-kuma] Port missing}"
    labels:
      # Reverse proxy config lives in docker/traefik/config/dynamic_configs_oracle/ (traefik-oracle has no Docker socket)
      # Monitor config
      kuma.uptime-kuma.http.name: "Uptime Kuma (Status Page)"
      kuma.uptime-kuma.http.url: "${UPTIME_KUMA_MONITOR_URL:?[uptime-kuma] Monitor URL missing}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - uptime-kuma
    ports:
      - "${UPTIME_KUMA_PORT:?[uptime-kuma] Port missing}:${UPTIME_KUMA_PORT:?[uptime-kuma] Port missing}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # Image's fixed 'node' user: embedded MariaDB refuses any other
    user: "1000:1000"
    volumes:
      # Persistent volumes
      - ../storage/uptime-kuma/data/:/app/data/
