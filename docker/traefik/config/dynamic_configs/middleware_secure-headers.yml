http:
  middlewares:
    secure-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
        customResponseHeaders:
          # Deprecated filter, known to be exploitable for XSS in the browsers that still honour it. OWASP
          # recommends disabling it explicitly rather than omitting the header. CSP does this job properly.
          X-XSS-Protection: "0"
          Content-Security-Policy: "frame-ancestors 'self'; upgrade-insecure-requests;"
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex,"
        forceSTSHeader: true
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        referrerPolicy: "same-origin"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: false  # Only enable if registered at https://hstspreload.org/
