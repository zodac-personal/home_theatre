# Traefik 3.x (YAML)
# Taken from https://github.com/brokenscripts/authentik_traefik/blob/traefik3/appdata/traefik/config/traefik.yaml

################################################################
# Global configuration - https://doc.traefik.io/traefik/reference/static-configuration/file/
################################################################

global:
  checkNewVersion: false
  sendAnonymousUsage: false

serversTransport:
  forwardingTimeouts:
    # Default timeouts to connect to a backend service
    dialTimeout: 20s
    responseHeaderTimeout: 30s
    idleConnTimeout: 1m

################################################################
# Logs - https://doc.traefik.io/traefik/observability/logs/
################################################################

# No filePath, so Traefik logs to stdout and the container's json-file driver (see compose/traefik.yml)
# owns rotation. maxSize/maxAge/maxBackups/compress are lumberjack settings that only take effect when
# filePath is set, so they are omitted here rather than left in place doing nothing.
log:
  level: INFO # Options: DEBUG, INFO, WARN, ERROR (Default), PANIC, FATAL
  noColor: false # Set to 'true' if format is 'json'

accessLog:
  filePath: "/var/log/traefik/access/access.log"
  format: json

################################################################
# API and Dashboard
################################################################

api:
  dashboard: true
  insecure: false  # Dashboard/API is exposed via the 'api@internal' router, behind auth
ping: { }

################################################################
# Entrypoints - https://doc.traefik.io/traefik/routing/entrypoints/
################################################################

entryPoints:
  # No longer published to the host, so it is reachable only from the Docker network:
  # used by `traefik healthcheck --ping` and the '/ping' router. Replaces the implicit
  # entrypoint that 'api.insecure' previously created.
  traefik:
    address: ":8080"

  # No 'web' entrypoint is defined. compose/traefik.yml publishes 443 only, so nothing off-host can reach
  # port 80 and a redirections block here would never fire: plaintext requests are redirected at the
  # Cloudflare edge instead ("Always Use HTTPS", which is what emits the 301 + cache-control: max-age=14400
  # seen on those redirects). If port 80 is ever published, re-add the entrypoint with its redirection.

  websecure:
    address: ":443"
    http:
      tls:
        options: default
    forwardedHeaders:
      trustedIPs:
        # Cloudflare (https://www.cloudflare.com/ips-v4)
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
        # Local IPs
        - "127.0.0.1/32"
        - "::1/128"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
        - "fc00::/7"
        - "fe80::/10"

################################################################
# Providers - https://doc.traefik.io/traefik/providers/docker/
################################################################

providers:
  # Enable autoloading of newly created rules by watching a directory
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true

  file:
    directory: /dynamic_configs
    watch: true

  redis:
    endpoints:
      - traefik-provider:6379

################################################################
# Plugins - https://plugins.traefik.io/plugins
################################################################

experimental:
  plugins:
    # Used to redirect when services are down
    traefik-plugin-redirect-on-status:
      moduleName: "github.com/m-riedel/traefik-plugin-redirect-on-status"
      version: "v1.0.1"
