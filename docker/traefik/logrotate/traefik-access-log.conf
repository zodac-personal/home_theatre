# Host-side logrotate config for Traefik's access log.
#
# Traefik never rotates its access log itself (the `log.maxSize`/`compress` settings only cover its own log),
# so without this `storage/<traefik-dir>/logs/access/access.log` grows forever.
# The file is renamed, then Traefik is sent USR1, which makes it close and reopen its log files, so no lines
# are lost and the new access.log is created by Traefik itself, as its own user.
#
# Install on each host that runs Traefik, from the repo checkout (placeholders filled in by sed, since
# logrotate needs absolute host paths and those must not be committed):
#
#   SER:    sudo sed -e "s|<REPO_DIR>|$PWD|" -e "s|<STORAGE_DIR>|traefik|" -e "s|<CONTAINER>|traefik|" \
#             docker/traefik/logrotate/traefik-access-log.conf | sudo tee /etc/logrotate.d/traefik-access-log
#   Oracle: sudo sed -e "s|<REPO_DIR>|$PWD|" -e "s|<STORAGE_DIR>|traefik-oracle|" -e "s|<CONTAINER>|traefik-oracle|" \
#             docker/traefik/logrotate/traefik-access-log.conf | sudo tee /etc/logrotate.d/traefik-access-log
#
# Then dry-run, force the first rotation, and check Traefik reopened the file:
#
#   sudo logrotate -d /etc/logrotate.d/traefik-access-log
#   sudo logrotate -f /etc/logrotate.d/traefik-access-log
#   sudo ls -ln <STORAGE_DIR>/logs/access/   # new access.log appears with the next request
#
# The system logrotate timer (`systemctl status logrotate.timer`) then runs it daily.
# Re-run the install command if this template changes.

<REPO_DIR>/storage/<STORAGE_DIR>/logs/access/access.log {
    daily
    rotate 14
    dateext
    compress
    # Yesterday's file stays uncompressed for a day, in case Traefik writes a last buffered line
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        docker kill --signal=USR1 <CONTAINER> >/dev/null 2>&1 || true
    endscript
}
