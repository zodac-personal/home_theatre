networks:
  dash:
    name: dash
    driver: bridge

services:

  # Server performance monitor
  dash:
    image: mauricenino/dashdot:6.2.4  # https://github.com/MauriceNino/dashdot/releases
    container_name: dash
    hostname: dash
    environment:
      # General
      DASHDOT_ALWAYS_SHOW_PERCENTAGES: "true"
      DASHDOT_PAGE_TITLE: "${DOMAIN_NAME:-dash.} [Main]"
      DASHDOT_ROUTING_PATH: "/main"
      DASHDOT_SHOW_DASH_VERSION: "bottom_right"
      DASHDOT_WIDGET_LIST: 'os,cpu,ram,storage,network'
      # CPU
      DASHDOT_ENABLE_CPU_TEMPS: "true"
      DASHDOT_CPU_WIDGET_MIN_WIDTH: "650"
      # OS
      DASHDOT_SHOW_HOST: "true"
      DASHDOT_OS_WIDGET_MIN_WIDTH: "650"
      # Network
      DASHDOT_ACCEPT_OOKLA_EULA: "true"
      # Storage
      DASHDOT_STORAGE_WIDGET_ITEMS_PER_PAGE: "6"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/info" ]
      timeout: 5s
    networks:
      - dash
    ports:
      - '4012:3001'
    privileged: true  # Needed to read RAM details
    restart: unless-stopped
    volumes:
        # Volume mounts from host system
        - "/:/mnt/host:ro"
