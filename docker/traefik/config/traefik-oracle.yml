# Traefik 3.x (YAML)
# Taken from https://github.com/brokenscripts/authentik_traefik/blob/traefik3/appdata/traefik/config/traefik.yaml

################################################################
# Global configuration - https://doc.traefik.io/traefik/reference/static-configuration/file/
################################################################

global:
  checkNewVersion: false
  sendAnonymousUsage: false

serversTransport:
  forwardingTimeouts:
    # Default timeouts to connect to a backend service
    dialTimeout: 20s
    responseHeaderTimeout: 30s
    idleConnTimeout: 1m

################################################################
# Logs - https://doc.traefik.io/traefik/observability/logs/
################################################################

log:
  level: INFO # Options: DEBUG, INFO, WARN, ERROR (Default), PANIC, FATAL
  noColor: false # Set to 'true' if format is 'json'
  maxSize: 100 # In megabytes
  compress: true # gzip compression when rotating

accessLog:
  filePath: "/var/log/traefik/access/access.log"
  format: json

################################################################
# API and Dashboard
################################################################

api:
  dashboard: true
  insecure: true
ping: { }

################################################################
# Entrypoints - https://doc.traefik.io/traefik/routing/entrypoints/
################################################################

entryPoints:
  # Dashboard/API (api.insecure) and ping. Defined explicitly, rather than left implicit, so it can carry the
  # same aliasHeadersStrategy as the others - see websecure below
  traefik:
    address: ":8080"
    http:
      aliasHeadersStrategy: delete

  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete  # see websecure below
      # Global HTTP to HTTPS redirection      
      redirections:
        entrypoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      # Same as SER's traefik.yml: a header whose name ALIASES another (X_Auth_User for X-Auth-User) is read as
      # that header by CGI/WSGI/PHP backends. 'delete' drops the aliasing header; 'reject' would 400 instead.
      aliasHeadersStrategy: delete
      # Same as SER's traefik.yml: deny only the two encoded characters with no legitimate use in a URL path
      # (split-view/traversal vectors such as ..%5c.. or a %00 truncation); a denied character gets a 400.
      encodedCharacters:
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
      tls:
        options: default
    forwardedHeaders:
      trustedIPs:
        # Cloudflare (https://www.cloudflare.com/ips-v4)
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
        # Local IPs
        - "127.0.0.1/32"
        - "::1/128"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
        - "fc00::/7"
        - "fe80::/10"

################################################################
# Providers - https://doc.traefik.io/traefik/providers/file/
################################################################

providers:
  # File provider only (docker/traefik/config/dynamic_configs_oracle/), so no Docker socket is needed.
  # Oracle services are routed from files there, NOT from Docker labels.
  file:
    directory: /dynamic_configs
    watch: true

# Following are not needed for oracle deployment
#  docker:
#    endpoint: "unix:///var/run/docker.sock"
#    exposedByDefault: false
#    watch: true
#
